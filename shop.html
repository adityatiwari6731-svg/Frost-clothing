<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Shop FROST — Contemporary women's silhouettes and refined home textiles. Pure linen, handloom cotton, and artisanal drapes." />
  <title>Shop FROST | Women's Fashion &amp; Home Living</title>

  <!-- Google Fonts: Cormorant Garamond, Playfair Display, Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Stylesheet -->
  <link rel="stylesheet" href="styles.css" />
  <style>
    /* Shop Catalog Specific Styles */
    .shop-hero-header {
      background-color: var(--frost-cream);
      padding: 3.5rem 1.5rem 2.5rem;
      text-align: center;
      border-bottom: 1px solid var(--frost-border);
    }
    .shop-hero-title {
      font-family: var(--font-serif);
      font-size: clamp(2.2rem, 4vw, 3.2rem);
      font-weight: 500;
      letter-spacing: 0.08em;
      color: var(--text-dark);
      margin-bottom: 0.6rem;
      text-transform: uppercase;
    }
    .shop-hero-sub {
      font-size: 1rem;
      color: var(--text-muted);
      max-width: 580px;
      margin: 0 auto 2rem;
      line-height: 1.6;
    }
    .shop-category-tabs {
      display: flex;
      justify-content: center;
      gap: 0.8rem;
      flex-wrap: wrap;
    }
    .shop-tab-pill {
      padding: 0.65rem 1.8rem;
      border-radius: 40px;
      border: 1px solid var(--frost-border);
      background: #ffffff;
      color: var(--text-dark);
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.25s ease;
      text-decoration: none;
    }
    .shop-tab-pill:hover,
    .shop-tab-pill.active {
      background: var(--frost-burgundy);
      color: #ffffff;
      border-color: var(--frost-burgundy);
    }

    .shop-main-layout {
      max-width: 1400px;
      margin: 0 auto;
      padding: 2.5rem 2rem 5rem;
      display: grid;
      grid-template-columns: 260px 1fr;
      gap: 3rem;
    }

    /* Sidebar Filters */
    .shop-sidebar {
      border-right: 1px solid var(--frost-border);
      padding-right: 2rem;
    }
    .filter-group {
      margin-bottom: 2rem;
      padding-bottom: 1.8rem;
      border-bottom: 1px solid rgba(0,0,0,0.06);
    }
    .filter-group:last-child {
      border-bottom: none;
    }
    .filter-heading {
      font-family: var(--font-sans);
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-dark);
      margin-bottom: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .filter-item-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }
    .filter-label-check {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 0.88rem;
      color: var(--text-muted);
      cursor: pointer;
      user-select: none;
      transition: color 0.2s ease;
    }
    .filter-label-check:hover {
      color: var(--text-dark);
    }
    .filter-label-check input[type="checkbox"],
    .filter-label-check input[type="radio"] {
      accent-color: var(--frost-burgundy);
      width: 16px;
      height: 16px;
      cursor: pointer;
    }

    /* Size Pills Filter */
    .filter-size-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .size-filter-pill {
      width: 42px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--frost-border);
      background: #ffffff;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-dark);
      cursor: pointer;
      transition: all 0.2s ease;
      border-radius: var(--radius-sm);
    }
    .size-filter-pill:hover,
    .size-filter-pill.active {
      border-color: var(--frost-burgundy);
      background: var(--frost-burgundy);
      color: #ffffff;
    }

    /* Color Swatch Filter */
    .filter-color-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
    }
    .color-filter-dot {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid transparent;
      outline: 1px solid rgba(0,0,0,0.15);
      transition: transform 0.2s ease, border-color 0.2s ease;
    }
    .color-filter-dot:hover,
    .color-filter-dot.active {
      transform: scale(1.15);
      border-color: #ffffff;
      outline: 2px solid var(--frost-burgundy);
    }

    /* Catalog Content Top Bar */
    .catalog-top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--frost-border);
      flex-wrap: wrap;
      gap: 1rem;
    }
    .catalog-count {
      font-size: 0.86rem;
      color: var(--text-muted);
    }
    .catalog-sort-select {
      padding: 0.55rem 1.2rem;
      border: 1px solid var(--frost-border);
      border-radius: var(--radius-sm);
      font-family: var(--font-sans);
      font-size: 0.84rem;
      background: #ffffff;
      color: var(--text-dark);
      outline: none;
      cursor: pointer;
    }

    /* 3 Column Grid for Shop Catalog */
    .shop-product-grid-3col {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 2rem;
    }

    /* Clear filters button */
    .btn-clear-filters {
      width: 100%;
      padding: 0.6rem;
      background: none;
      border: 1px solid var(--frost-border);
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
      cursor: pointer;
      border-radius: var(--radius-sm);
      transition: all 0.2s ease;
    }
    .btn-clear-filters:hover {
      background: var(--frost-cream);
      color: var(--text-dark);
    }

    /* Mobile filter drawer trigger */
    .mobile-filter-trigger {
      display: none;
      align-items: center;
      gap: 0.5rem;
      padding: 0.6rem 1.2rem;
      border: 1px solid var(--frost-border);
      background: #ffffff;
      border-radius: var(--radius-sm);
      font-size: 0.84rem;
      font-weight: 600;
      cursor: pointer;
    }

    @media (max-width: 992px) {
      .shop-main-layout {
        grid-template-columns: 1fr;
        padding: 1.5rem 1rem 4rem;
      }
      .shop-sidebar {
        display: none;
      }
      .shop-sidebar.mobile-open {
        display: block;
        position: fixed;
        top: 0;
        left: 0;
        width: 85%;
        max-width: 340px;
        height: 100vh;
        background: #ffffff;
        z-index: 300;
        padding: 2rem 1.5rem;
        overflow-y: auto;
        box-shadow: 0 10px 40px rgba(0,0,0,0.25);
      }
      .mobile-filter-trigger {
        display: inline-flex;
      }
      .shop-product-grid-3col {
        grid-template-columns: repeat(2, 1fr);
        gap: 1.2rem;
      }
    }
    @media (max-width: 540px) {
      .shop-product-grid-3col {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <!-- Injected Announcement Top Bar -->
  <div id="frost-topbar"></div>

  <!-- Injected Luxury Header -->
  <div id="frost-header"></div>

  <main>
    <!-- Header / Category Filter Section -->
    <header class="shop-hero-header">
      <h1 class="shop-hero-title">SHOP FROST</h1>
      <p class="shop-hero-sub">Women's fashion and refined home textiles, made for everyday living.</p>
      
      <div class="shop-category-tabs">
        <button class="shop-tab-pill active" data-cat="all" onclick="filterCatalogCategory('all')">ALL</button>
        <button class="shop-tab-pill" data-cat="women" onclick="filterCatalogCategory('women')">WOMEN</button>
        <button class="shop-tab-pill" data-cat="home" onclick="filterCatalogCategory('home')">HOME &amp; LIVING</button>
      </div>
    </header>

    <!-- Main Shop Section with Sidebar and Product Grid -->
    <div class="shop-main-layout">
      <!-- Sidebar Filters -->
      <aside class="shop-sidebar" id="shop-sidebar">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem;" class="mobile-filter-header">
          <h4 style="font-family:var(--font-serif); font-size:1.2rem; margin:0;">FILTERS</h4>
          <button onclick="toggleMobileFilters()" style="background:none; border:none; font-size:1.2rem; cursor:pointer;" class="mobile-filter-close">✕</button>
        </div>

        <!-- Subcategories -->
        <div class="filter-group">
          <div class="filter-heading">Category</div>
          <ul class="filter-item-list" id="filter-subcat-list">
            <li><label class="filter-label-check"><input type="radio" name="subcat" value="all" checked onchange="filterSubcategory('all')" /> All Categories</label></li>
            <li><label class="filter-label-check"><input type="radio" name="subcat" value="dresses" onchange="filterSubcategory('dresses')" /> Dresses &amp; Kurtis</label></li>
            <li><label class="filter-label-check"><input type="radio" name="subcat" value="coords" onchange="filterSubcategory('coords')" /> Co-ord Sets</label></li>
            <li><label class="filter-label-check"><input type="radio" name="subcat" value="bottoms" onchange="filterSubcategory('bottoms')" /> Trousers &amp; Bottoms</label></li>
            <li><label class="filter-label-check"><input type="radio" name="subcat" value="bedding" onchange="filterSubcategory('bedding')" /> Bedsheets &amp; Bedding</label></li>
            <li><label class="filter-label-check"><input type="radio" name="subcat" value="living" onchange="filterSubcategory('living')" /> Curtains &amp; Cushions</label></li>
            <li><label class="filter-label-check"><input type="radio" name="subcat" value="dining" onchange="filterSubcategory('dining')" /> Table Linen</label></li>
          </ul>
        </div>

        <!-- Reset -->
        <button class="btn-clear-filters" onclick="resetAllFilters()">Clear All Filters</button>
      </aside>

      <!-- Products Grid Column -->
      <section class="shop-content-area" aria-label="Products Catalog">
        <div class="catalog-top-bar">
          <div style="display:flex; align-items:center; gap:1rem;">
            <button class="mobile-filter-trigger" onclick="toggleMobileFilters()">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg>
              <span>Filters</span>
            </button>
            <span class="catalog-count" id="catalog-count-label">Showing Products</span>
          </div>

          <!-- Quick Search Bar in Catalog Toolbar -->
          <div class="catalog-search-wrap" style="display:flex; align-items:center; background:#ffffff; border:1.5px solid var(--frost-border); border-radius:var(--radius-sm); padding:0.4rem 0.9rem; min-width:240px; flex:1; max-width:400px; box-shadow:0 1px 4px rgba(0,0,0,0.03);">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--text-muted); margin-right:0.6rem; flex-shrink:0;"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text" id="catalog-search-input" placeholder="Search catalog..." style="border:none; outline:none; width:100%; font-size:0.86rem; font-family:var(--font-sans); background:transparent;" oninput="filterCatalogBySearch(this.value)" />
            <button type="button" id="catalog-search-clear" onclick="filterCatalogBySearch('')" style="display:none; background:none; border:none; color:var(--text-muted); cursor:pointer; font-size:0.85rem; padding-left:4px;">✕</button>
          </div>

          <div style="display:flex; align-items:center; gap:0.6rem;">
            <label for="catalog-sort" style="font-size:0.84rem; color:var(--text-muted);">Sort By:</label>
            <select id="catalog-sort" class="catalog-sort-select" onchange="handleSortChange(this.value)">
              <option value="featured">Featured</option>
              <option value="price-low">Price: Low to High</option>
              <option value="price-high">Price: High to Low</option>
              <option value="newest">Newest First</option>
            </select>
          </div>
        </div>

        <!-- Product Cards Container -->
        <div class="shop-product-grid-3col" id="shop-products-grid">
          <!-- Rendered dynamically from FROST_PRODUCTS -->
        </div>
      </section>
    </div>
  </main>

  <!-- Injected Footer + Drawers + Modals + Mobile Bottom Navigation -->
  <div id="frost-footer-area"></div>

  <!-- Scripts -->
  <script src="supabase-client.js"></script>
  <script src="shared.js"></script>
  <script>
    let activeCategory = 'all';
    let activeSubcat = 'all';
    let currentSort = 'featured';
    let activeSearchQuery = '';

    function renderShopCatalog() {
      const grid = document.getElementById('shop-products-grid');
      const countLabel = document.getElementById('catalog-count-label');
      if (!grid) return;

      let items = [...FROST_PRODUCTS];

      // Filter search query
      if (activeSearchQuery) {
        const q = activeSearchQuery.toLowerCase();
        items = items.filter(p => 
          (p.title && p.title.toLowerCase().includes(q)) ||
          (p.description && p.description.toLowerCase().includes(q)) ||
          (p.fabric && p.fabric.toLowerCase().includes(q)) ||
          (p.craft && p.craft.toLowerCase().includes(q)) ||
          (p.categoryName && p.categoryName.toLowerCase().includes(q)) ||
          (p.category && p.category.toLowerCase().includes(q))
        );
      }

      // Filter category
      if (activeCategory === 'women') {
        items = items.filter(p => p.category === 'sarees' || p.category === 'women');
      } else if (activeCategory === 'home') {
        items = items.filter(p => p.category === 'home' || p.category === 'bedsheets' || p.category === 'cushions' || p.category === 'pillows' || p.category === 'tablecloths');
      }

      // Filter subcategory
      if (activeSubcat !== 'all') {
        items = items.filter(p => {
          const text = (p.id + ' ' + p.title + ' ' + (p.categoryName || '') + ' ' + (p.subCategory || '')).toLowerCase();
          if (activeSubcat === 'dresses') return text.includes('dress') || text.includes('kurti');
          if (activeSubcat === 'coords') return text.includes('coord');
          if (activeSubcat === 'bottoms') return text.includes('bottoms') || text.includes('pant') || text.includes('trouser');
          if (activeSubcat === 'bedding') return text.includes('bedsheet') || text.includes('bed') || text.includes('linen');
          if (activeSubcat === 'living') return text.includes('curtain') || text.includes('cushion') || text.includes('pillow');
          if (activeSubcat === 'dining') return text.includes('runner') || text.includes('table') || text.includes('cloth');
          return true;
        });
      }

      // Sort
      if (currentSort === 'price-low') {
        items.sort((a, b) => a.priceINR - b.priceINR);
      } else if (currentSort === 'price-high') {
        items.sort((a, b) => b.priceINR - a.priceINR);
      }

      countLabel.textContent = `Showing ${items.length} Product${items.length !== 1 ? 's' : ''}`;

      if (items.length === 0) {
        grid.innerHTML = `
          <div style="grid-column: 1 / -1; text-align: center; padding: 4rem 1rem;">
            <p style="font-size: 1.1rem; color: var(--text-muted); margin-bottom: 1.2rem;">No items match your selected filters.</p>
            <button class="btn-burgundy" onclick="resetAllFilters()">Reset Filters</button>
          </div>
        `;
        return;
      }

      grid.innerHTML = items.map(p => `
        <div class="product-card-frost" data-id="${p.id}">
          <div class="card-media-wrap">
            <a href="product.html?id=${p.id}">
              <img src="${p.image}" alt="${p.title}" loading="lazy" />
            </a>
            ${p.badge ? `<span class="card-badge-frost">${p.badge}</span>` : ''}
            <button class="card-wishlist-toggle" onclick="toggleWishlist('${p.id}')" aria-label="Save to Wishlist">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
            </button>
            <button class="card-quick-add-bar" onclick="addToCart('${p.id}')">QUICK ADD</button>
          </div>
          <div class="card-info-wrap">
            <span class="card-category-tag">${p.categoryName || (p.category === 'home' ? 'Home & Living' : 'Women')}</span>
            <a href="product.html?id=${p.id}" class="card-product-title">${p.title}</a>
            <span class="card-product-price">${formatCurrency(p.priceINR)}</span>
            <div class="card-color-swatches">
              <span class="swatch-dot" style="background:#889F8D;" title="Sage Green"></span>
              <span class="swatch-dot" style="background:#ECE6DA;" title="Ivory Cream"></span>
              ${p.id.includes('bordeaux') ? '<span class="swatch-dot" style="background:#6C151E;" title="Bordeaux"></span>' : ''}
              ${p.id.includes('curtain') ? '<span class="swatch-dot" style="background:#0F382C;" title="Forest Green"></span>' : ''}
            </div>
          </div>
        </div>
      `).join('');
    }

    function filterCatalogCategory(cat) {
      activeCategory = cat;
      document.querySelectorAll('.shop-tab-pill').forEach(btn => {
        btn.classList.toggle('active', btn.getAttribute('data-cat') === cat);
      });
      renderShopCatalog();
    }

    function filterSubcategory(sub) {
      activeSubcat = sub;
      renderShopCatalog();
    }

    function handleSortChange(sortVal) {
      currentSort = sortVal;
      renderShopCatalog();
    }

    function filterCatalogBySearch(query) {
      activeSearchQuery = query || '';
      const input = document.getElementById('catalog-search-input');
      if (input && input.value !== activeSearchQuery) {
        input.value = activeSearchQuery;
      }
      const clearBtn = document.getElementById('catalog-search-clear');
      if (clearBtn) clearBtn.style.display = activeSearchQuery ? 'inline' : 'none';

      const heroSub = document.querySelector('.shop-hero-sub');
      if (heroSub) {
        if (activeSearchQuery) {
          heroSub.innerHTML = `Showing results for: "<strong>${activeSearchQuery}</strong>" &bull; <a href="javascript:void(0)" onclick="filterCatalogBySearch('')" style="color:var(--frost-burgundy);text-decoration:underline;margin-left:6px;">Clear Search</a>`;
        } else {
          heroSub.textContent = "Women's fashion and refined home textiles, made for everyday living.";
        }
      }
      renderShopCatalog();
    }

    function resetAllFilters() {
      activeCategory = 'all';
      activeSubcat = 'all';
      currentSort = 'featured';
      activeSearchQuery = '';

      const searchInput = document.getElementById('catalog-search-input');
      if (searchInput) searchInput.value = '';
      const clearBtn = document.getElementById('catalog-search-clear');
      if (clearBtn) clearBtn.style.display = 'none';

      const heroSub = document.querySelector('.shop-hero-sub');
      if (heroSub) {
        heroSub.textContent = "Women's fashion and refined home textiles, made for everyday living.";
      }

      document.querySelectorAll('.shop-tab-pill').forEach(b => b.classList.toggle('active', b.getAttribute('data-cat') === 'all'));
      const sortSelect = document.getElementById('catalog-sort');
      if (sortSelect) sortSelect.value = 'featured';
      const defaultRadio = document.querySelector('input[name="subcat"][value="all"]');
      if (defaultRadio) defaultRadio.checked = true;

      renderShopCatalog();
    }

    function toggleMobileFilters() {
      const sidebar = document.getElementById('shop-sidebar');
      if (sidebar) sidebar.classList.toggle('mobile-open');
    }

    // React immediately when products are added or deleted in Admin panel
    window.addEventListener('frost:products-updated', () => {
      if (typeof refreshProductsFromStorage === 'function') refreshProductsFromStorage();
      renderShopCatalog();
    });
    window.addEventListener('storage', (e) => {
      if (e.key && e.key.startsWith('frost_')) {
        if (typeof refreshProductsFromStorage === 'function') refreshProductsFromStorage();
        renderShopCatalog();
      }
    });

    // URL parameter parsing on load
    document.addEventListener('DOMContentLoaded', () => {
      if (typeof refreshProductsFromStorage === 'function') refreshProductsFromStorage();
      const urlParams = new URLSearchParams(window.location.search);
      const cat = urlParams.get('cat');
      const sub = urlParams.get('sub');
      const searchParam = urlParams.get('search') || urlParams.get('q');

      if (cat) {
        filterCatalogCategory(cat);
      } else {
        renderShopCatalog();
      }
      if (sub) {
        activeSubcat = sub;
        const r = document.querySelector(`input[name="subcat"][value="${sub}"]`);
        if (r) r.checked = true;
        renderShopCatalog();
      }
      if (searchParam) {
        filterCatalogBySearch(searchParam);
      }
    });
  </script>
</body>
</html>
